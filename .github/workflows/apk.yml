name: Generate APK

env:
  main_project_module: app

on:
  push:
    branches:
      - "main"
      - "feature/**"
      - "release/**"
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "v*.*.* (optional)"
        required: false
        type: string
        default: "0.1.0-ptp"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set Version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_ENV
          elif [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "version=$(echo '${{ github.ref_name }}' | sed 's/^v//')" >> $GITHUB_ENV
          else
            echo "version=0.1.0-ptp-${{ github.run_number }}" >> $GITHUB_ENV
          fi

      - name: Use JDK
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"
          cache: "gradle"

      - name: Build Debug & Release
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)
          chmod +x ./gradlew
          if [ -n "${{ secrets.STORE }}" ]; then
            echo "${{ secrets.STORE }}" | base64 -d > upload.jks
            echo "${{ secrets.LOCAL }}" | base64 -d > local.properties
            ./gradlew assembleRelease bundleRelease assembleDebug --stacktrace
            rm -f upload.jks local.properties
          else
            echo "No signing secrets provided, building debug APK..."
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: airplay-debug-ptp
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish (GitHub Release)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: v${{ env.version }}
          tag_name: v${{ env.version }}
          files: |
            ${{ env.main_project_module }}/build/outputs/apk/debug/app-debug.apk
            ${{ env.main_project_module }}/build/outputs/apk/release/*.apk
        continue-on-error: true